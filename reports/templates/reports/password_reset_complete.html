{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>NDMS | Password Changed</title>

    <link rel="stylesheet"
          href="{% static 'reports/login.css' %}">


</head>


<body class="login-page">


<main class="login-wrapper">


    <a href="{% url 'home' %}"
       class="login-brand">

        <div class="login-logo">
            ND
        </div>

        <div class="login-brand-text">

            <strong>
                NDMS
            </strong>

            <span>
                National Disaster Management System
            </span>

        </div>

    </a>



    <section class="login-card">


        <div class="login-heading">

            <span class="login-label">
                ACCOUNT RECOVERY
            </span>

            <h1>
                Password changed
            </h1>

            <p>
                Your NDMS password has been successfully updated.
                You can now sign in with your new password.
            </p>

        </div>



        <a href="{% url 'login' %}"
           class="login-button"
           style="text-decoration: none;">

            <span>
                Sign In
            </span>

            <span class="login-arrow">
                →
            </span>

        </a>


    </section>



    <footer class="login-footer">

        <span>
            © 2026 National Disaster Management System
        </span>

    </footer>


</main>


</body>

</html>
