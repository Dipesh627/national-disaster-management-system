{% extends 'reports/auth_base.html' %}

{% block title %}NDMS | Password Changed{% endblock %}

{% block content %}

    <!-- Status icon: check -->

    <div class="auth-status auth-status--success" aria-hidden="true">

        <svg viewBox="0 0 24 24"
             fill="none"
             stroke="currentColor"
             stroke-width="2"
             stroke-linecap="round"
             stroke-linejoin="round">

            <circle cx="12" cy="12" r="9" />

            <path d="m8.5 12.5 2.5 2.5 4.5-5" />

        </svg>

    </div>


    <header class="auth-heading">

        <p class="auth-eyebrow">Account recovery</p>

        <h1>Password changed</h1>

        <p class="auth-lead">
            Your NDMS password has been successfully updated. You
            can now sign in with your new password.
        </p>

    </header>


    <a href="{% url 'login' %}"
       class="auth-btn auth-btn--arrow">
        Sign In
    </a>

{% endblock %}
