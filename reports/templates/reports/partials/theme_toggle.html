{% comment %}
Theme toggle button (shared). Behaviour: reports/js/theme.js
Style: reports/ndms-theme.css (.theme-toggle)
Icon shows the current theme (sun = light, moon = dark); the
accessible name stays constant and aria-pressed carries the state.
{% endcomment %}
<button
    type="button"
    class="theme-toggle"
    data-theme-toggle
    aria-pressed="false"
    aria-label="Dark theme"
    title="Switch to dark theme"
>
    <svg class="theme-icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.5 14.2A8.5 8.5 0 0 1 9.8 3.5a8.5 8.5 0 1 0 10.7 10.7Z"/></svg>
    <svg class="theme-icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6 6 6M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4 6 18M18 6l1.4-1.4"/></svg>
</button>
